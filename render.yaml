services:
  - type: web
    name: fio-transcripts-api
    runtime: python
    plan: free
    buildCommand: pip install -r requirements-cloud.txt
    startCommand: gunicorn cloud_api:app --bind 0.0.0.0:$PORT --workers 1 --threads 2 --timeout 600
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: ALLOWED_ORIGIN
        value: https://joaopedroparreira.github.io
      - key: WHISPER_MODEL
        value: tiny
      - key: MAX_VIDEO_SECONDS
        value: 180
      - key: MAX_MEDIA_BYTES
        value: 31457280
      - key: OMP_NUM_THREADS
        value: 1
      - key: HF_HUB_DISABLE_TELEMETRY
        value: 1
